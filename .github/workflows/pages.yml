name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотека – новые референсы с сайта и чистка удалённых снимков
        run: |
          pip install -q pillow numpy
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('data/referest-inbox.json')) else 1)" 2>/dev/null; then
            python3 tools/referest.py vhodyashie
          fi
          python3 tools/referest.py chistka
          git config user.name "baza-blokov bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data ref
          git diff --cached --quiet || (git commit -q -m "Библиотека: новые референсы и чистка снимков" && git push)
      - name: Сборка (в конце – проверка тёмной темы)
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
