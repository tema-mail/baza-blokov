<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Демо: сторис – лента карточек и полноэкранный просмотр</title>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
body{padding:48px 0}
/* лента: 7 вертикальных карточек, на десктопе делят ширину поровну */
.st-row{display:flex;gap:16px}
.st{position:relative;flex:1;min-width:0;height:350px;border-radius:22px;overflow:hidden;text-align:left;color:#fff;transition:transform .6s var(--ease)}
.st-ph{position:absolute;inset:0;background:linear-gradient(160deg,var(--a),var(--b));transition:transform 1.1s var(--ease)}
.st-ph::before{content:attr(data-l);position:absolute;left:0;right:0;top:44%;padding:0 10px;text-align:center;font-size:11.5px;color:rgb(255 255 255/.6)}
.st-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(rgb(0 0 0/.22),transparent 24%,transparent 62%,rgb(0 0 0/.45))}
.st-top{position:absolute;z-index:2;left:14px;right:14px;top:14px;display:flex;gap:4px}
.st-top i{flex:1;height:2.5px;border-radius:2px;background:rgb(255 255 255/.55)}
.st-av{position:absolute;z-index:2;left:14px;top:26px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--acc);transition:box-shadow .4s}
.st-av::after{content:"";width:14px;height:14px;border-radius:4px;background:var(--acc)}
.st.seen .st-av{box-shadow:0 0 0 2.5px rgb(255 255 255/.45)}
.st.seen .st-ph{filter:saturate(.55)}
.st-play{position:absolute;z-index:2;right:14px;top:26px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11px}
.st b{position:absolute;z-index:2;left:16px;right:14px;bottom:16px;font-size:14px;line-height:1.3;font-weight:700}
@media (hover:hover){.st:hover{transform:translateY(-6px)}.st:hover .st-ph{transform:scale(1.06)}}

/* просмотр: тёмный размытый фон, по центру кадр 9:16 */
.sv{position:fixed;inset:0;z-index:90;display:grid;place-items:center;visibility:hidden;pointer-events:none;transition:visibility 0s .5s}
.sv.open{visibility:visible;pointer-events:auto;transition:none}
.sv>*{opacity:0;transition:opacity .45s}
.sv.open>*{opacity:1}
.sv-bg{position:absolute;inset:0;background:rgb(10 12 11/.78);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.sv-box{position:relative;height:min(780px,calc(100svh - 48px));aspect-ratio:9/16;max-width:calc(100vw - 32px);border-radius:28px;overflow:hidden;background:#101411;transform:scale(.94);transition:transform .6s var(--ease)}
.sv.open .sv-box{transform:none}
.sv-media{position:absolute;inset:0}
.sv-bgi{position:absolute;inset:-20%;background:linear-gradient(160deg,var(--a),var(--b));filter:blur(48px) brightness(.82)}
.sv-fg{position:absolute;left:0;right:0;top:50%;aspect-ratio:4/3;transform:translateY(-50%);display:grid;place-items:center;background:linear-gradient(160deg,var(--a),var(--b));color:rgb(255 255 255/.75);font-size:13px;text-align:center;padding:0 20px}
.sv-fg.v{inset:0;aspect-ratio:auto;transform:none}
.sv-media::after{content:"";position:absolute;inset:0;background:linear-gradient(rgb(0 0 0/.35),transparent 22%,transparent 70%,rgb(0 0 0/.45));pointer-events:none}
.sv-bars{position:absolute;z-index:3;left:14px;right:14px;top:14px;display:flex;gap:4px}
.sv-bars span{flex:1;height:3px;border-radius:3px;background:rgb(255 255 255/.35);overflow:hidden}
.sv-bars i{display:block;height:100%;background:#fff;transform-origin:0 0;transform:scaleX(0)}
.sv-head{position:absolute;z-index:3;left:14px;right:90px;top:30px;display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:700}
.sv-head i{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.sv-head i::after{content:"";width:14px;height:14px;border-radius:4px;background:var(--acc)}
.sv-tap{position:absolute;z-index:2;top:0;bottom:0;left:0;width:40%;-webkit-tap-highlight-color:transparent}
.sv-tap.r{left:auto;right:0;width:60%}
.sv-snd{position:absolute;z-index:4;right:14px;top:30px;height:34px;padding:0 14px;border-radius:99px;background:rgb(0 0 0/.35);color:#fff;font-size:12.5px;font-weight:700}
.sv .btn{position:absolute;z-index:4;left:16px;right:16px;bottom:16px}
.sv-x{position:absolute;z-index:5;right:24px;top:24px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.14);color:#fff;font-size:26px;line-height:1;transition:background .4s}
.sv-arr{position:absolute;z-index:5;top:50%;height:48px;margin-top:-24px;padding:0 22px;border-radius:99px;background:rgb(255 255 255/.14);color:#fff;font-size:14.5px;font-weight:700;transition:background .4s}
.sv-arr.l{right:calc(50% + min(780px,100svh - 48px) * 9 / 32 + 24px)}
.sv-arr.r{left:calc(50% + min(780px,100svh - 48px) * 9 / 32 + 24px)}
.sv-x:hover,.sv-arr:hover{background:rgb(255 255 255/.28)}
.sv.open~.hint{display:none}

@media (max-width:760px){
  body{padding:44px 0}
  .st-row{margin:0 -16px;padding:0 16px;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;overscroll-behavior-x:contain}
  .st-row::-webkit-scrollbar{display:none}
  .st{flex:none;width:134px;height:214px;border-radius:20px;scroll-snap-align:start}
  .st-top{display:none}
  .st-av{left:9px;top:9px;width:26px;height:26px}
  .st-av::after{width:11px;height:11px}
  .st-play{right:9px;top:9px;width:26px;height:26px}
  .st b{left:10px;right:8px;bottom:10px;font-size:11.5px;line-height:1.2}
  .sv-box{width:100vw;max-width:none;height:100svh;aspect-ratio:auto;border-radius:0}
  .sv-bars{top:max(10px,env(safe-area-inset-top))}
  .sv-arr{display:none}
  .sv-x{right:12px;top:auto;bottom:86px;width:46px;height:46px}
}
</style>
</head>
<body>
<section class="stories"><div class="wrap">
  <div class="st-row" role="list">
    <button class="st rv" type="button" data-s="0" role="listitem" style="--a:#7d9a8a;--b:#33463c"><span class="st-ph" data-l="Кадр: главный товар или предложение"></span><span class="st-top"><i></i><i></i><i></i></span><span class="st-av"></span><b>Тема 1: предложение недели</b></button>
    <button class="st rv" type="button" data-s="1" role="listitem" style="--a:#a18f78;--b:#4a3d30"><span class="st-ph" data-l="Видео: человек в кадре"></span><span class="st-top"><i></i></span><span class="st-av"></span><span class="st-play">▶</span><b>Тема 2: видео с объекта</b></button>
    <button class="st rv" type="button" data-s="2" role="listitem" style="--a:#8c8f98;--b:#34363d"><span class="st-ph" data-l="Кадр: эксперт объясняет"></span><span class="st-top"><i></i></span><span class="st-av"></span><b>Тема 3: на чём не экономить</b></button>
    <button class="st rv" type="button" data-s="3" role="listitem" style="--a:#6f8fa6;--b:#2b3b47"><span class="st-ph" data-l="Кадр: готовая работа"></span><span class="st-top"><i></i><i></i></span><span class="st-av"></span><b>Тема 4: работа целиком</b></button>
    <button class="st rv" type="button" data-s="4" role="listitem" style="--a:#9c8a9f;--b:#3d3340"><span class="st-ph" data-l="Кадр: руководитель на месте"></span><span class="st-top"><i></i><i></i></span><span class="st-av"></span><b>Тема 5: кто отвечает</b></button>
    <button class="st rv" type="button" data-s="5" role="listitem" style="--a:#8fa078;--b:#3a452c"><span class="st-ph" data-l="Кадр: клиент у результата"></span><span class="st-top"><i></i></span><span class="st-av"></span><b>Тема 6: отзыв клиента</b></button>
    <button class="st rv" type="button" data-s="6" role="listitem" style="--a:#a6857d;--b:#45302b"><span class="st-ph" data-l="Кадр: трудный случай"></span><span class="st-top"><i></i><i></i></span><span class="st-av"></span><b>Тема 7: сложный случай</b></button>
  </div>
</div></section>

<div class="sv" id="sv" aria-hidden="true" role="dialog" aria-label="Сторис">
  <div class="sv-bg" data-close></div>
  <button class="sv-x" type="button" data-close aria-label="Закрыть">×</button>
  <button class="sv-arr l" type="button">Назад</button>
  <div class="sv-box">
    <div class="sv-media"></div>
    <div class="sv-bars"></div>
    <div class="sv-head"><i></i><b class="sv-ttl"></b></div>
    <button class="sv-tap l" type="button" aria-label="Предыдущий"></button><button class="sv-tap r" type="button" aria-label="Следующий"></button>
    <button class="sv-snd" type="button" hidden>Звук</button>
    <a class="btn sv-cta" href="#">Подробнее<i>→</i></a>
  </div>
  <button class="sv-arr r" type="button">Дальше</button>
</div>
<span class="hint">Нажмите на карточку: удержание – пауза</span>

<script type="application/json" id="meta">
{
  "id": "storis",
  "nazvanie": "Сторис: лента карточек и полноэкранный просмотр",
  "tip": "MEDIA",
  "etap": "WANT",
  "vopros": "Что у них происходит прямо сейчас и можно ли посмотреть это быстро, без длинного текста?",
  "smysl": "Привычный по соцсетям формат: человек сам листает короткие кадры и видео по темам – предложение, живая работа, эксперт, отзыв. Длинный текст заменяется пятью секундами на кадр, а кнопка «Подробнее» из каждой истории ведёт на страницу этой темы. Отметка «просмотрено» подталкивает открыть остальные.",
  "setka_d": "Лента на все 12 колонок: 7 карточек одинаковой ширины (около 1,7 колонки каждая) с зазором 16 px, высота 350 px, скругление 22 px. В карточке: полоски по числу кадров сверху, кружок-аватар слева под ними, значок видео справа, заголовок внизу на затемнении. Просмотр – кадр 9:16 по центру экрана высотой до 780 px, по бокам кнопки «Назад» и «Дальше», крестик в правом верхнем углу экрана.",
  "setka_m": "Горизонтальная лента на все 4 колонки и дальше за край: карточки 134 × 214 px с зазором 10 px, прилипают к краю при прокрутке (snap), полоски в карточке скрыты. Просмотр на весь экран без скруглений: полоски сверху с учётом выреза, заголовок, кнопка «Подробнее» внизу, крестик справа над ней (низ 86 px). Стрелок нет – только тапы и свайп.",
  "animaciya": [
    "Наведение на карточку (только мышь): подъём на 6 px за 0,6 с и приближение кадра в 1,06 раза за 1,1 с",
    "Открытие: фон и кнопки проявляются за 0,45 с, кадр вырастает из 0,94 до 1 за 0,6 с; прокрутка страницы замирает",
    "Полоска текущего кадра заполняется 5 с, по окончании – следующий кадр; после последнего кадра темы – следующая тема; после последней темы просмотр закрывается",

  "kak_rabotaet": [

  "kogda": "Есть живой поток материала: стройка, производство, мастерская, поступления товара, отзывы на видео. Аудитория с телефона, привыкшая к соцсетям. Хорош сразу под первым экраном – вход в темы сайта через картинки.",
  "ne_kogda": "Нечего показать, кроме стоковых картинок, или темы не обновляются месяцами – лента выглядит заброшенной. Меньше четырёх тем. Строгая B2B-аудитория, где формат соцсетей выглядит несерьёзно.",
  "u_cerusa": "Семь тем сразу под первым экраном: дом на продажу, видео с объекта, ролик про качество, готовые дома, директор на объектах, семья у своего дома. Кадров в теме от одного до трёх, одна тема – видео со значком воспроизведения и кнопкой «Звук». Под заголовком карточки – размытая копия кадра, прорезанная маской «V». Класс «просмотрено» ставится и хранится, но видимой разницы в стилях у карточки почти нет. Кнопка «Подробнее» ведёт на страницу дома, раздел «как строим», «о компании» или отзывы.",

<script>
(function () {
  var K = Kit, sv = K.$('#sv'), bars = K.$('.sv-bars', sv), media = K.$('.sv-media', sv), ttl = K.$('.sv-ttl', sv), snd = K.$('.sv-snd', sv), cta = K.$('.sv-cta', sv);
  // темы: заголовок, страница темы, кадры (v – видео, l – роль кадра)
  var S = [
    { u: '#tema-1', s: [{ l: 'Фото 1: общий вид' }, { l: 'Фото 2: деталь' }, { l: 'Фото 3: с другой стороны' }] },
    { u: '#tema-2', s: [{ v: 1, l: 'Видео: вертикальный ролик' }] },
    { u: '#tema-3', s: [{ l: 'Фото: эксперт в кадре' }] },
    { u: '#tema-4', s: [{ l: 'Фото 1: с высоты' }, { l: 'Фото 2: вблизи' }] },
    { u: '#tema-5', s: [{ l: 'Фото 1: на месте работ' }, { l: 'Фото 2: разговор с бригадой' }] },
    { u: '#tema-6', s: [{ l: 'Фото: клиент у результата' }] },
    { u: '#tema-7', s: [{ l: 'Фото 1: исходные условия' }, { l: 'Фото 2: решение' }] }
  ];
  var cards = K.$$('.st'), cur = { s: 0, i: 0 }, raf = 0, start = 0, dur = 5000, paused = false, pauseAt = 0, downAt = 0, muted = true;
  var seen = []; try { seen = JSON.parse(localStorage.getItem('demo-storis-seen')) || [] } catch (e) {}
  function markSeen() { cards.forEach(function (b) { b.classList.toggle('seen', seen.indexOf(+b.dataset.s) > -1) }) }
  markSeen();

  function drawBars() { bars.innerHTML = S[cur.s].s.map(function () { return '<span><i></i></span>' }).join('') }
  function setBar(k) { K.$$('i', bars).forEach(function (b, j) { b.style.transform = 'scaleX(' + (j < cur.i ? 1 : j > cur.i ? 0 : k) + ')' }) }
  function show() {
    cancelAnimationFrame(raf);
    var card = cards[cur.s], it = S[cur.s].s[cur.i];
    ttl.textContent = K.$('b', card).textContent; cta.href = S[cur.s].u;
    sv.style.setProperty('--a', card.style.getPropertyValue('--a')); sv.style.setProperty('--b', card.style.getPropertyValue('--b'));
    media.innerHTML = '<span class="sv-bgi"></span><span class="sv-fg' + (it.v ? ' v' : '') + '">' + it.l + '</span>';
    snd.hidden = !it.v; muted = true; snd.textContent = 'Звук';
    if (seen.indexOf(cur.s) < 0) { seen.push(cur.s); try { localStorage.setItem('demo-storis-seen', JSON.stringify(seen)) } catch (e) {} markSeen() }
    var d0 = it.v ? 8000 : dur; start = performance.now(); paused = false; setBar(0);
    (function tick(t) { if (!paused) { var k = (t - start) / d0; setBar(Math.min(1, k)); if (k >= 1) return next() } raf = requestAnimationFrame(tick) })(start);
  }
  function open(s) { cur = { s: s, i: 0 }; drawBars(); sv.classList.add('open'); sv.setAttribute('aria-hidden', 'false'); K.lock(true); show() }
  function close() { cancelAnimationFrame(raf); sv.classList.remove('open'); sv.setAttribute('aria-hidden', 'true'); K.lock(false) }
  function next() { if (cur.i < S[cur.s].s.length - 1) { cur.i++; show() } else if (cur.s < S.length - 1) { cur = { s: cur.s + 1, i: 0 }; drawBars(); show() } else close() }
  function prev() { if (cur.i > 0) { cur.i--; show() } else if (cur.s > 0) { cur = { s: cur.s - 1, i: 0 }; drawBars(); show() } else show() }

  cards.forEach(function (b) { b.addEventListener('click', function () { open(+b.dataset.s) }) });
  K.$$('.sv-tap', sv).forEach(function (t) {
    t.addEventListener('pointerdown', function () { paused = true; pauseAt = downAt = performance.now() });
    function up() { if (paused) { start += performance.now() - pauseAt; paused = false } }
    t.addEventListener('pointerup', up); t.addEventListener('pointerleave', up); t.addEventListener('pointercancel', up);
    t.addEventListener('click', function () { if (performance.now() - downAt > 250) return; t.classList.contains('r') ? next() : prev() });
    t.addEventListener('contextmenu', function (e) { e.preventDefault() });
  });
  K.$('.sv-arr.r', sv).addEventListener('click', next);
  K.$('.sv-arr.l', sv).addEventListener('click', prev);
  snd.addEventListener('click', function () { muted = !muted; snd.textContent = muted ? 'Звук' : 'Без звука' });
  K.$$('[data-close]', sv).forEach(function (b) { b.addEventListener('click', close) });
  cta.addEventListener('click', function (e) { e.preventDefault(); close() });
  addEventListener('keydown', function (e) {
    if (!sv.classList.contains('open')) return;
    if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev();
  });
  var ty = 0;
  sv.addEventListener('touchstart', function (e) { ty = e.touches[0].clientY }, { passive: true });
  sv.addEventListener('touchend', function (e) { if (e.changedTouches[0].clientY - ty > 90) close() });
  // после появления снимаем встроенный transform, иначе он перекроет подъём при наведении
  cards.forEach(function (c) { c.addEventListener('transitionend', function (e) { if (e.propertyName === 'transform' && c.style.transform) { c.style.transform = ''; c.style.transition = '' } }) });
  K.reveal('.rv');
})();
</script>
</body>
</html>
