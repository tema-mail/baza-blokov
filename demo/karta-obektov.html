<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Демо: карта объектов с карточкой у метки</title>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
.mp{padding:32px 0 24px}
.mp-h{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:26px}

/* карта: карточка с рамкой, внутри фон-заглушка, плашка «в работе», метки и плавающая карточка объекта */
.mp-box{position:relative;height:520px;margin:0 12px;border:6px solid var(--card);border-radius:28px;overflow:hidden;background:var(--soft)}
.mp-map{position:absolute;inset:0}
.mp-bg{position:absolute;inset:0;width:100%;height:100%}
.mp-bg path{fill:none;stroke:var(--line);stroke-width:2}
.mp-bg .f{fill:var(--ph);stroke:none;opacity:.45}
.mp-bg .w{stroke:var(--ph);stroke-width:18;stroke-linecap:round}
.mp-bg text{font-size:13px;fill:var(--mut)}
.mp-now{position:absolute;z-index:5;left:18px;top:18px;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 12px 30px rgb(0 0 0/.12)}
.mp-now b{font-weight:800}
.mp-now i{position:relative;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.mp-now i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--acc);animation:mp-live 1.8s ease-out infinite}
@keyframes mp-live{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}

/* метка: остриё стоит в точке left/top, активная приподнята и увеличена */
.mp-pin{position:absolute;z-index:2;width:46px;height:46px;color:var(--acc);transform:translate(-50%,-88%);transition:transform .45s var(--ease)}
.mp-pin svg{width:100%;height:100%;filter:drop-shadow(0 3px 5px rgb(0 0 0/.25))}
.mp-pin.on{transform:translate(-50%,-94%) scale(1.14)}
@media (hover:hover){.mp-pin:hover{transform:translate(-50%,-94%) scale(1.14)}}

/* карточка объекта: одна на все метки, left/top ставит скрипт */
.mp-card{position:absolute;z-index:6;left:0;top:0;width:270px;padding:10px 10px 16px;border-radius:20px;background:var(--card);box-shadow:0 24px 56px rgb(0 0 0/.2);opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .3s,transform .45s var(--ease)}
.mp-card.on{opacity:1;transform:none}
.mp-card .ph{display:block;height:150px;margin-bottom:12px;border-radius:12px}
.mp-card .ph.in{animation:mp-in .35s ease both}
@keyframes mp-in{from{opacity:0}}
.mp-card small,.mp-card b,.mp-card p{display:block;padding:0 8px}
.mp-card small{font-size:12px;font-weight:700;color:var(--acc)}
.mp-card small:empty{display:none}
.mp-card b{margin-top:5px;font:800 15px/1.2 system-ui,sans-serif;text-transform:uppercase}
.mp-card p{margin-top:5px;font-size:13px;line-height:1.4;color:var(--mut)}

/* плашки-цифры: заходят на низ карты */
.mp-st{position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;list-style:none;margin-top:-70px}
.mp-st li{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--card);box-shadow:0 16px 44px rgb(0 0 0/.1)}
.mp-st .ph{grid-row:span 2;width:76px;height:76px;min-height:0;border-radius:10px}
.mp-st b{align-self:end;font:800 30px/1 system-ui,sans-serif;letter-spacing:-.02em}
.mp-st li>span:last-child{align-self:start;margin-top:6px;font-size:13px;line-height:1.35;color:var(--mut)}

@media (max-width:760px){
  .mp{padding:28px 0 20px}
  .mp-h{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:20px}
  .mp-box{height:460px;margin:0 8px;border-radius:24px}
  .mp-now{left:10px;top:10px;height:40px;padding:0 14px 0 12px;font-size:13px}
  .mp-pin{width:50px;height:50px}
  .mp-card{right:12px;width:auto;display:grid;grid-template-columns:104px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:12px;padding:8px 12px 8px 8px;border-radius:18px}
  .mp-card .ph{grid-row:1/4;height:96px;margin:0}
  .mp-card small,.mp-card b,.mp-card p{padding:0}
  .mp-card small{margin-top:4px}
  .mp-card b{font-size:13.5px}
  .mp-card p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px}
  .mp-st{grid-template-columns:1fr 1fr;gap:8px;margin-top:-40px}
  .mp-st li{grid-template-columns:1fr;justify-items:center;padding:12px;border-radius:18px;text-align:center}
  .mp-st .ph{grid-row:auto;width:52px;height:52px;margin-bottom:8px}
  .mp-st b{font-size:24px}
  .mp-st li>span:last-child{font-size:12px}
}
</style>
</head>
<body>

      <button class="mp-pin" type="button" style="left:80%;top:39%" data-t="Объект 9" data-s="Тип объекта · размер" data-d="Сдан: месяц и год" aria-label="Объект 9"><svg><use href="#pin"/></svg></button>
      <button class="mp-pin" type="button" style="left:57%;top:46%" data-t="Объект 10" data-s="Рядом с объектом 3: на телефоне метки раздвинуты" data-d="" aria-label="Объект 10"><svg><use href="#pin"/></svg></button>
      <button class="mp-pin" type="button" style="left:24%;top:60%" data-t="Объект 11" data-s="Тип объекта · размер" data-d="Сдан: месяц и год" aria-label="Объект 11"><svg><use href="#pin"/></svg></button>
      <button class="mp-pin" type="button" style="left:75%;top:63%" data-t="Объект 12" data-s="Тип объекта · размер" data-d="Сдан: месяц и год" aria-label="Объект 12"><svg><use href="#pin"/></svg></button>
      <div class="mp-card" aria-hidden="true"><span class="ph" data-l="Фото объекта"></span><small></small><b></b><p></p></div>
    </div>
  </div>

  <ul class="wrap mp-st">
    <li class="rv"><span class="ph" data-l="Иконка"></span><b data-n="48">48</b><span>сдано объектов</span></li>
    <li class="rv"><span class="ph" data-l="Иконка"></span><b data-n="5">5</b><span>в работе сейчас</span></li>
    <li class="rv"><span class="ph" data-l="Иконка"></span><b data-n="120">120</b><span>вариантов в каталоге</span></li>
    <li class="rv"><span class="ph" data-l="Иконка"></span><b><span data-n="200">200</span> км</b><span>радиус, где работаем</span></li>

</section>

<script>
(function () {
  var K = Kit, map = K.$('.mp-map'), pins = K.$$('.mp-pin'), card = K.$('.mp-card'), now = K.$('.mp-now');
  var ph = K.$('.ph', card), cur = -1, t = 0, NEAR = 44;

  // телефон: метки ближе 44 px друг к другу раздвигаем, иначе пальцем в нужную не попасть
  if (K.mob()) {
    var mw = map.offsetWidth, mh = map.offsetHeight;
    var P = pins.map(function (p) { return { x: parseFloat(p.style.left) * mw / 100, y: parseFloat(p.style.top) * mh / 100 } });
    for (var pass = 0; pass < 4; pass++) P.forEach(function (a, i) {
      P.slice(i + 1).forEach(function (b) {
        var dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
        if (dist >= NEAR) return;
        var k = (NEAR - dist) / 2 / (dist || 1); if (!dist) dx = 1;
        a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k;
      });
    });
    pins.forEach(function (p, i) {
      p.style.left = Math.max(6, Math.min(94, P[i].x / mw * 100)).toFixed(1) + '%';
      p.style.top = Math.max(10, Math.min(86, P[i].y / mh * 100)).toFixed(1) + '%';
    });
  }

  // место карточки: считаем от точки метки (px, py – середина значка)
  function place(p) {
    var W = map.offsetWidth, H = map.offsetHeight, px = p.offsetLeft, py = p.offsetTop - p.offsetHeight * .45, x, y;
    var underNow = now.offsetTop + now.offsetHeight + 10;
    if (K.mob()) {
      card.style.left = '12px';
      card.style.top = (py > H / 2 ? underNow : H - 62 - card.offsetHeight) + 'px';
      return;
    }
    var cw = card.offsetWidth, ch = card.offsetHeight, pad = 14, gap = 40, top = pad;
    var right = px + gap + cw <= W - pad, left = px - gap - cw >= pad;
    if (right || left) { x = right ? px + gap : px - gap - cw; y = py - ch / 2 }
    else { x = Math.max(pad, Math.min(W - cw - pad, px - cw / 2)); y = py - ch - 46; if (y < top) y = py + 34 }
    if (x < now.offsetLeft + now.offsetWidth + 8) top = underNow;
    card.style.left = x + 'px';
    card.style.top = Math.max(top, Math.min(H - 96 - ch, y)) + 'px';
  }
  function show(i) {
    clearTimeout(t); if (i === cur && card.classList.contains('on')) return;
    cur = i; var p = pins[i];
    pins.forEach(function (x, k) { x.classList.toggle('on', k === i) });
    ph.dataset.l = 'Фото: ' + p.dataset.t.toLowerCase();
    ph.classList.remove('in'); void ph.offsetWidth; ph.classList.add('in');
    K.$('small', card).textContent = p.dataset.d; K.$('b', card).textContent = p.dataset.t; K.$('p', card).textContent = p.dataset.s;
    place(p); card.classList.add('on');
  }
  function hide() {
    t = setTimeout(function () { card.classList.remove('on'); pins.forEach(function (x) { x.classList.remove('on') }); cur = -1 }, 250);
  }
  pins.forEach(function (p, i) {
    p.addEventListener('click', function () { show(i) });
    if (K.fine) { p.addEventListener('mouseenter', function () { show(i) }); p.addEventListener('mouseleave', hide) }
  });
  new IntersectionObserver(function (es) { if (es[0].isIntersecting && cur < 0) show(0) }, { threshold: .5 }).observe(map);
  if (!K.fine) map.addEventListener('click', function (e) { if (!e.target.closest('.mp-pin')) hide() });

  K.reveal('.rv'); K.count();
})();
</script>
</body>
</html>
