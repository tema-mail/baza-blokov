<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Демо: факты и гарантии</title>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
/* белая коробка: слева фото во всю высоту, справа текст и карточки, прижатые к низу */
.fx{padding:28px 0 24px}
.box{display:grid;grid-template-columns:minmax(0,.66fr) minmax(0,1fr);gap:52px;margin:0 12px;padding:24px;border-radius:32px;background:var(--card)}
.fx-ph{position:relative;min-height:560px;border-radius:16px;overflow:hidden}
.fx-ph>.ph{position:absolute;inset:0;border-radius:0}
/* круглый бейдж: текст по кругу вращается, значок в центре стоит */
.badge{position:absolute;left:20px;top:20px;width:124px;height:124px;border-radius:50%;display:grid;place-items:center}
.badge svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 26s linear infinite}
.badge text{font:700 15px system-ui,sans-serif;text-transform:uppercase;fill:currentColor}
.badge i{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-style:normal;font-size:24px;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}

.fx-r{display:flex;flex-direction:column;padding:12px 28px 0 0}
.fx-r .h2{font-size:clamp(22px,2.7vw,34px)}
.fx-r .lead{margin-bottom:28px}
.fx-g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
/* карточка-цифра: число и подпись внизу, предмет-символ в правом верхнем углу */
.fc{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;height:220px;padding:22px 24px;border-radius:24px;background:var(--soft);overflow:hidden}
.fc .obj{position:absolute;z-index:-1;right:-12px;top:-12px;width:150px;height:128px;min-height:0;transition:transform 1s var(--ease)}
@media (hover:hover){.fc:hover .obj{transform:translateY(-6px)}}
.fc .num small{font-size:.5em;letter-spacing:0}
.fc .cap{display:block;max-width:210px;margin-top:10px;font-size:13.5px;line-height:1.45;color:var(--mut)}
/* карточка-предложение: на всю ширину, фото + метка, значение, статус; целиком ссылка */
.offer{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:stretch;height:210px;padding:12px}
.of-ph{position:relative;border-radius:12px;overflow:hidden}
.of-ph .ph{position:absolute;inset:0;border-radius:0;transform:scale(1.08);transition:transform 1.2s var(--ease)}
@media (hover:hover){.offer:hover .of-ph .ph{transform:scale(1.14)}}
.of-t{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 14px 6px 0}
.of-t .tag{background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--acc)}
.of-t .num{margin-top:12px;font-size:clamp(26px,3.2vw,40px)}
.of-t .st{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600}
.of-t .st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}

@media (max-width:760px){
  .fx{padding:16px 0}
  .box{grid-template-columns:1fr;gap:0;margin:0 8px;padding:8px;border-radius:28px}
  .fx-ph{min-height:0;aspect-ratio:1/1.08;border-radius:20px}
  .badge{left:14px;top:14px;width:104px;height:104px}
  .badge i{width:50px;height:50px;font-size:20px}
  .fx-r{padding:36px 0 0}
  .fx-r>.h2,.fx-r>.lead{padding:0 12px}
  .fx-r .lead{margin-bottom:0}
  .fx-g{gap:8px;margin-top:22px}
  .fc{height:200px;padding:16px;border-radius:20px}
  .fc .obj{width:112px;height:96px}
  .fc .num{font-size:30px}
  .fc .cap{font-size:12.5px}
  .offer{grid-template-columns:1fr;gap:0;height:auto;padding:8px}
  .of-ph{height:190px}
  .of-t{padding:16px 10px 10px}
}
</style>
</head>
<body>
<section class="fx"><div class="box">
  <div class="fx-ph rv"><div class="ph" data-l="Фото результата: готовый объект целиком"></div>
    <span class="badge glass" aria-hidden="true"><svg viewBox="0 0 200 200"><defs><path id="ring" d="M100 26a74 74 0 1 1 0 148a74 74 0 1 1 0-148"/></defs><text><textPath href="#ring" textLength="456" lengthAdjust="spacing">гарантия одной фразой • гарантия одной фразой •</textPath></text></svg><i>✓</i></span>
  </div>
  <div class="fx-r">
    <b class="h2 rv">Чем отвечаем за срок <em>и за результат</em></b>
    <p class="lead rv">Одна-две фразы: где это записано и как проверить до оплаты. Не «мы надёжные», а пункт договора и открытые цены.</p>
    <div class="fx-g">
      <article class="fc rv"><span class="ph obj" data-l="Предмет: договор"></span><b class="num"><span data-n="0.5">0,5</span><small> %</small></b><span class="cap">что это за цифра и где она записана: пункт договора</span></article>
      <article class="fc rv"><span class="ph obj" data-l="Предмет: ключи"></span><b class="num"><span data-n="10">10</span> лет</b><span class="cap">срок гарантии<br>по договору</span></article>
      <a class="fc offer rv" href="#"><span class="of-ph"><span class="ph" data-l="Фото готового предложения"></span></span><span class="of-t"><span class="tag">Готовое предложение</span><b class="num">120 м²</b><span class="st">статус: в наличии</span></span></a>
    </div>
  </div>
</div></section>

<script>
(function () {
  var K = Kit;
  K.reveal('.fx-ph', { glass: true }); /* внутри стеклянный бейдж: только сдвиг */
  K.reveal('.fx-r .rv');
  K.count();

</script>
